<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Matcher</title>
    <style>
        .game-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .color-box {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        #box1 { background-color: red; }
        #box2 { background-color: blue; }
        #box3 { background-color: green; }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div id="box1" class="color-box"> </div>
        <div id="box2" class="color-box"> </div>
        <div id="box3" class="color-box"> </div>
    </div>
    
    <div class="buttons">
        <button style="padding: 10px;">1</button>
        <button style="padding: 10px;">2</button>
        <button style="padding: 10px;">3</button>
    </div>
</body>
</html>
